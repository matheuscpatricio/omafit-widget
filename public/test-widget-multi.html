<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Widget OmaFit - Múltiplas Imagens</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .product-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .product-images {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .product-image {
      width: 150px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .product-image.active {
      border-color: #1E40AF;
    }
    .product-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .product-price {
      font-size: 20px;
      color: #666;
      margin-bottom: 20px;
    }
    .btn {
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-primary {
      background: #000;
      color: white;
    }
    .btn-primary:hover {
      background: #333;
    }
  </style>
</head>
<body>
  <div class="product-card">
    <h1 class="product-title">Vestido Elegante - Teste Múltiplas Imagens</h1>

    <div class="product-images product__media">
      <img class="product-image active" src="https://images.pexels.com/photos/1536619/pexels-photo-1536619.jpeg" alt="Imagem 1">
      <img class="product-image" src="https://images.pexels.com/photos/1926769/pexels-photo-1926769.jpeg" alt="Imagem 2">
      <img class="product-image" src="https://images.pexels.com/photos/1488507/pexels-photo-1488507.jpeg" alt="Imagem 3">
      <img class="product-image" src="https://images.pexels.com/photos/1385472/pexels-photo-1385472.jpeg" alt="Imagem 4">
    </div>

    <p class="product-price">R$ 299,90</p>

    <button class="btn btn-primary">Adicionar ao Carrinho</button>

    <!-- WIDGET OMAFIT -->
    <div class="omafit-widget">
      <a href="javascript:void(0);" class="omafit-try-on-link">
        🔍 Experimentar virtualmente
      </a>
    </div>
  </div>

  <script>
  (function() {
    // Função para normalizar URLs
    function normalizeUrl(url) {
      if (!url) return null;
      if (url.startsWith('//')) {
        return 'https:' + url;
      }
      return url;
    }

    // Função para obter todas as imagens do produto
    function getAllProductImages() {
      const images = new Set();
      const productImages = document.querySelectorAll('.product__media img, .product-images img');

      productImages.forEach(img => {
        if (img.src && img.naturalWidth > 400 && img.naturalHeight > 400) {
          const cleanUrl = img.src.split('?')[0];
          images.add(normalizeUrl(cleanUrl));
        }
      });

      const imagesArray = Array.from(images);
      console.log('📸 Total de imagens encontradas:', imagesArray.length, imagesArray);
      return imagesArray;
    }

    // Função para obter imagem principal
    function getProductImageFromPage() {
      const activeImg = document.querySelector('.product-image.active');
      if (activeImg && activeImg.src) {
        return normalizeUrl(activeImg.src);
      }

      const firstImg = document.querySelector('.product-image');
      return firstImg ? normalizeUrl(firstImg.src) : null;
    }

    // Configuração do OmaFit
    const productInfo = {
      productId: 'test-product-multi-001',
      productName: 'Vestido Elegante'
    };

    const OMAFIT_CONFIG = {
      apiUrl: 'http://localhost:5173',
      publicId: 'test-public-id',
      productId: productInfo.productId,
      productName: productInfo.productName,
      getProductImage: getProductImageFromPage,
      linkText: '🔍 Experimentar virtualmente',
      storeName: 'Minha Loja Teste',
      storeLogo: '',
      fontFamily: 'Outfit, sans-serif',
      colors: {
        primary: '#810707',
        background: '#ffffff',
        text: '#810707',
        overlay: '#810707CC'
      }
    };

    // Função para abrir o modal
    window.openOmafitModal = function() {
      const productImage = OMAFIT_CONFIG.getProductImage();

      if (!productImage) {
        alert('Não foi possível detectar a imagem do produto nesta página.\\nVerifique se você está em uma página de produto.');
        return;
      }

      const allProductImages = getAllProductImages();
      console.log('📸 Imagens que serão enviadas:', allProductImages);

      // Criar overlay
      const overlay = document.createElement('div');
      overlay.className = 'omafit-modal-overlay';
      overlay.style.cssText =
        'position: fixed;' +
        'top: 0;' +
        'left: 0;' +
        'width: 100%;' +
        'height: 100%;' +
        'background: rgba(0, 0, 0, 0.8);' +
        'z-index: 999999;' +
        'display: flex;' +
        'align-items: center;' +
        'justify-content: center;' +
        'padding: 20px;' +
        'box-sizing: border-box;' +
        'backdrop-filter: blur(4px);';

      // Criar iframe do widget
      const iframe = document.createElement('iframe');
      const config = {
        storeName: OMAFIT_CONFIG.storeName || 'Omafit',
        primaryColor: OMAFIT_CONFIG.colors.primary,
        storeLogo: OMAFIT_CONFIG.storeLogo,
        fontFamily: OMAFIT_CONFIG.fontFamily
      };

      const widgetUrl = OMAFIT_CONFIG.apiUrl + '/widget?productImage=' + encodeURIComponent(productImage) +
        '&productImages=' + encodeURIComponent(JSON.stringify(allProductImages)) +
        '&productId=' + encodeURIComponent(OMAFIT_CONFIG.productId || 'unknown') +
        '&productName=' + encodeURIComponent(OMAFIT_CONFIG.productName || 'Produto') +
        '&publicId=' + encodeURIComponent(OMAFIT_CONFIG.publicId) +
        '&config=' + encodeURIComponent(JSON.stringify(config));

      console.log('🔗 Widget URL:', widgetUrl);
      iframe.src = widgetUrl;
      iframe.allow = 'camera; microphone; fullscreen';
      iframe.style.cssText =
        'width: 95vw;' +
        'max-width: 1000px;' +
        'height: 85vh;' +
        'max-height: 800px;' +
        'border: none;' +
        'border-radius: 16px;' +
        'background: white;' +
        'box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);';

      // Botão de fechar
      const closeButton = document.createElement('button');
      closeButton.innerHTML = '×';
      closeButton.style.cssText =
        'position: absolute;' +
        'top: 10px;' +
        'right: 10px;' +
        'width: 40px;' +
        'height: 40px;' +
        'border: none;' +
        'border-radius: 50%;' +
        'background: rgba(255, 255, 255, 0.9);' +
        'color: #810707;' +
        'font-size: 24px;' +
        'cursor: pointer;' +
        'z-index: 1000000;' +
        'font-weight: bold;';

      // Eventos de fechamento
      const closeModal = function() {
        if (document.body.contains(overlay)) {
          document.body.removeChild(overlay);
          document.body.style.overflow = '';
        }
      };

      closeButton.addEventListener('click', closeModal);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
          closeModal();
        }
      });

      // Montar modal
      overlay.appendChild(iframe);
      overlay.appendChild(closeButton);
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden';
    };

    // Aplicar estilos ao link
    const link = document.querySelector('.omafit-try-on-link');
    if (link) {
      link.style.color = OMAFIT_CONFIG.colors.primary;
      link.style.textDecoration = 'underline';
      link.style.cursor = 'pointer';
      link.style.fontSize = '16px';
      link.style.fontWeight = '500';
    }

    // Tornar imagens clicáveis
    document.querySelectorAll('.product-image').forEach(img => {
      img.addEventListener('click', function() {
        document.querySelectorAll('.product-image').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });
  })();
  </script>
</body>
</html>
