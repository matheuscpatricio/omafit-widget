<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Documento do widget: `*` evita negar câmara no próprio contexto; a delegação desde a loja continua a depender do `allow` no iframe do tema. -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, fullscreen=*" />
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors *">

    <title>Omafit — AI fashion assistant for e-commerce | Sizing & try-on</title>
    <meta name="description" content="Omafit is the AI assistant on your product pages: sizing, photorealistic try-on, and style guidance. We implement on any fashion store. Plans from US$ 99/mo." />
    <meta name="keywords" content="Omafit, fashion e-commerce, virtual try-on, AI try-on, size recommendation, online store, reduce returns, MediaPipe, storefront widget, AI stylist" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Omafit" />
    <meta name="theme-color" content="#810707" />

    <link rel="canonical" href="https://omafit.co/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://omafit.co/" />
    <meta property="og:site_name" content="Omafit" />
    <meta property="og:title" content="Omafit — AI fashion assistant for e-commerce | Sizing & try-on" />
    <meta property="og:description" content="Sizing, photorealistic try-on, and AI stylist on your product pages. We implement on any fashion store." />
    <meta property="og:image" content="https://omafit.co/images/landing/og-omafit.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Omafit — AI for fashion e-commerce" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omafit — AI fashion for e-commerce" />
    <meta name="twitter:description" content="Sizing, try-on, and AI stylist on your PDP. We implement on any store. Fewer returns, more sales." />
    <meta name="twitter:image" content="https://omafit.co/images/landing/og-omafit.png" />

    <!-- Wordmark Omafit (logotipo); landing: Gloock + Bricolage + DM Mono -->
    <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
    <link href="https://fonts.cdnfonts.com/css/jhc-rasbora" rel="stylesheet" />
    <!-- Tipografia landing Omafit (Gloock + Bricolage Grotesque + DM Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gloock:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Admin / gerador / widget: Inter, Outfit, Bungee (fora da landing) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Gloock:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <!-- Netlify Forms: captura envios da Etapa 2 (avaliação comportamental) → e-mail -->
    <form name="etapa2-avaliacao" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="subject" />
      <input name="candidate_name" />
      <input name="candidate_email" />
      <input name="response_id" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
